# Bundle: daily training job for the music-genre model and its serving endpoint.
#   databricks bundle validate -t dev
#   databricks bundle deploy   -t dev
#   databricks bundle run      -t dev genre_model_train
# Credentials come from the Databricks CLI login (databricks auth login); nothing secret is stored in this repo.
# The workspace host is public and is set per target below.
bundle:
  name: genre_model

include:
  - resources/*.yml

# The schema workspace.chinook is created by src/load_chinook.py (CREATE SCHEMA IF NOT EXISTS), not as a
# bundle resource: in development mode a bundle schema would be renamed dev_<user>_chinook.

sync:
  include:
    - data/*.csv
    - sql/*.sql

targets:
  dev:
    # No 'mode: development': that mode pauses every schedule and prefixes resource names, and the
    # assignment needs the daily run active under the plain job name.
    default: true
    workspace:
      host: https://dbc-c19856c3-faa2.cloud.databricks.com
